fullnameOverride: gateway-service

image:
  repository: ""  # Will be set in CI/CD
  tag: "latest"
  pullPolicy: Always

service:
  port: 8080

env:
  - name: CARS_SERVICE_URL
    value: "http://cars-service:8070"
  - name: RENTAL_SERVICE_URL
    value: "http://rental-service:8060"
  - name: PAYMENT_SERVICE_URL
    value: "http://payment-service:8050"
  - name: OIDC_ISSUER
    value: "http://localhost:8080"
  - name: OIDC_AUDIENCE
    value: "rsoi-lab5-ci"
  - name: OIDC_CLIENT_ID
    value: "rsoi-lab5-ci"
  - name: OIDC_CLIENT_SECRET
    value: "rsoi-lab5-ci-secret"
  - name: OIDC_TOKEN_URL
    value: "http://gateway-service:8080/oauth/token"
  - name: OIDC_JWKS
    value: '{"keys":[{"kty":"oct","kid":"local-ci","k":"cnNvaS1sYWI1LWNpLXNlY3JldA"}]}'
  - name: OIDC_SCOPE
    value: "openid profile email"
  - name: OIDC_ENABLE_LOCAL_TOKEN_ISSUER
    value: "true"

command:
  - uvicorn
  - services.gateway_service.main:app
  - --host
  - 0.0.0.0
  - --port
  - "8080"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: ""  # Will be set based on cluster ingress
      paths:
        - path: /
          pathType: Prefix

